<h2 id="01--%E8%83%8C%E6%99%AF%E6%95%B0%E6%8D%AE%E6%95%A3%E6%B4%BB%E5%8A%A8%E6%95%A3%E6%8A%A5%E8%A1%A8%E9%87%8D">01 · 背景：数据散、活动散、报表重</h2>
<p><strong>一个学期的样本规模</strong>：12 条记录 · 4 名志愿者 · 7 个项目 · 累计 46.0 小时（校内 27.5 + 校外 18.5）</p>
<table>
<thead>
<tr>
<th>痛点一 · 手工流程</th>
<th>痛点二 · 活动分散</th>
<th>本项目目标</th>
</tr>
</thead>
<tbody>
<tr>
<td>① 收表 → ② 统一字段 → ③ 按日期筛 → ④ 逐人累加 → ⑤ 重做汇总</td>
<td>活动散落在班群、公众号、海报里，报名链接与截止时间各不相同</td>
<td>说清时间范围与需求，工具自动执行</td>
</tr>
<tr>
<td>任一步改数据，后面全部重来</td>
<td>校内活动和校外活动混着看，凑时长全凭感觉</td>
<td>校内 / 校外分开算，总计一眼看到</td>
</tr>
</tbody>
</table>
<p><strong>为什么这件事适合交给 Agent</strong></p>
<ul>
<li>规则明确 → 能工具化：筛选、分组、求和都是确定性操作</li>
<li>结果可验 → 不怕幻觉：每个数字都能回到原始记录</li>
<li>入口自然 → 适合对话：学生只会说“帮我统计一下”，不写公式</li>
</ul>
<blockquote>
<p>规模说明：真实院系一学期通常是数百条记录；本 demo 用 12 条压缩演示，保证一次答辩跑完全部链路。</p>
</blockquote>
<blockquote>

<h2 id="02--%E6%96%B9%E6%A1%88%E6%8A%8A%E9%87%8D%E5%A4%8D%E5%8A%B3%E5%8A%A8%E4%BA%A4%E7%BB%99-agent-%E6%89%A7%E8%A1%8C">02 · 方案：把重复劳动交给 Agent 执行</h2>
<p>模型只做两件事：理解要什么、决定调用哪个工具；计算与出表全部在本地完成。</p>
<table>
<thead>
<tr>
<th>能力</th>
<th>做法</th>
<th>输出</th>
</tr>
</thead>
<tbody>
<tr>
<td>条件查询</td>
<td>按起止日期检索，可按项目名筛选、只看校内或校外</td>
<td>结构化记录数组 + 分类合计</td>
</tr>
<tr>
<td>分组统计</td>
<td>按姓名分组累加，统计参与次数</td>
<td>4 人排名，合计 46.0 小时</td>
</tr>
<tr>
<td>校内外拆分</td>
<td>每条记录带「类型」，一次给出校内 / 校外 / 总计</td>
<td>12.5 / 3.0 / 15.5（示例：张三）</td>
</tr>
<tr>
<td>导出报表</td>
<td>写 xlsx 并挂到页面</td>
<td>志愿时长汇总_日期_时分.xlsx</td>
</tr>
<tr>
<td>记录登记</td>
<td>只填活动名称与时长，身份取自绑定账号，类型可自动判断</td>
<td>写入记录并返回本人累计</td>
</tr>
<tr>
<td>活动发现</td>
<td>全国省 / 市 / 区县三级定位，校内校外分开</td>
<td>活动列表 + 距离 + 报名链接</td>
</tr>
</tbody>
</table>
<p><strong>链路一 · 时长统计</strong>：查询 → 统计 → 导出，一句话串起三个工具<br />
<strong>链路二 · 校内外拆分</strong>：<code>calc_hours_by_type</code> 一次调用返回校内 / 校外 / 总计与占比<br />
<strong>链路三 · 活动发现</strong>：绑定学校 → <code>query_open_activities</code> 一次调用返回结果；校内实时刷新，校外可按全国任意省市区县查，同城按距离排队、跨市按日期排序<br />
<strong>链路四 · 活动登记</strong>：绑定个人账号 → 只说&quot;做了什么、几小时&quot;即可写入，写完立刻可查询、统计、导出</p>
<p><strong>范围界定</strong>：面向在校学生与院系志愿负责人，单机运行；省市区县与高校名单为公开开源数据，活动条目为课程自建的演示内容。</p>

<h2 id="04--%E4%BB%A3%E7%A0%81%E8%AE%B2%E8%A7%A3-%E2%91%A0%E6%A0%B8%E5%BF%83%E5%BE%AA%E7%8E%AF%E6%A8%A1%E5%9E%8B%E5%8F%AA%E5%86%B3%E5%AE%9A%E8%B0%83%E8%B0%81">04 · 代码讲解 ①：核心循环，模型只决定调谁</h2>
<p><strong><code>run_agent()</code> 一次请求最多 6 轮：模型给工具名与参数，本地执行后把结果回填，再让模型继续判断</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">6</span>):                        <span class="hljs-comment"># ① 轮次上限，防失控</span>
    resp = client.chat.completions.create(
        model=MODEL_NAME, messages=messages,
        tools=TOOLS_SCHEMA, temperature=<span class="hljs-number">0.3</span>)
    msg = resp.choices[<span class="hljs-number">0</span>].message

    <span class="hljs-keyword">if</span> msg.tool_calls:                    <span class="hljs-comment"># ② 模型决定调哪个工具</span>
        messages.append({<span class="hljs-string">&quot;role&quot;</span>: <span class="hljs-string">&quot;assistant&quot;</span>,
                         <span class="hljs-string">&quot;tool_calls&quot;</span>: normalized_calls})
        <span class="hljs-keyword">for</span> name, args, call_id <span class="hljs-keyword">in</span> parsed_calls:
            result = execute_tool(name, args)      <span class="hljs-comment"># ③ 本地真实执行</span>
            messages.append({<span class="hljs-string">&quot;role&quot;</span>: <span class="hljs-string">&quot;tool&quot;</span>,       <span class="hljs-comment"># ④ 结果回填</span>
                <span class="hljs-string">&quot;tool_call_id&quot;</span>: call_id,
                <span class="hljs-string">&quot;content&quot;</span>: json.dumps(result, ensure_ascii=<span class="hljs-literal">False</span>)})
        <span class="hljs-keyword">continue</span>                          <span class="hljs-comment"># ⑤ 带着结果再问一次模型</span>

    history.append((<span class="hljs-string">&quot;assistant&quot;</span>, msg.content))  <span class="hljs-comment"># ⑥ 自然语言收尾</span>
    <span class="hljs-keyword">return</span>
</code></pre>
<ul>
<li>① <strong>轮次上限 6</strong>：防止模型反复调工具停不下来，超限给出明确提示并可重试</li>
<li>② <strong>决策权在模型</strong>：代码里没有 <code>if &quot;统计&quot; in text</code> 这类关键词分支</li>
<li>③ <strong>执行权在代码</strong>：<code>execute_tool</code> 是本地真实函数，pandas 筛选、openpyxl 写文件</li>
<li>④ <strong>回填形成闭环</strong>：<code>role=tool</code> 带 <code>tool_call_id</code>，模型下一轮才能&quot;看到&quot;真实结果</li>
<li>⑤ <strong>六轮仍未收敛</strong> → 提示拆分需求，不无限重试；参数 JSON 截断时先规范化再回填，避免 400</li>
</ul>
<blockquote>
<p>三个数字：<strong>6 轮</strong>调用上限 · 典型链路 <strong>3 次</strong>工具调用 · 代码中 <strong>0 处</strong>关键词分支。</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 口播：第一段是最核心的 run_agent 循环。一次请求最多 6 轮：发 messages 和 schema 给模型，模型说调工具就本地真执行，结果用 role=tool 回填再问模型。四点要强调：最多 6 轮防打转；决策权在模型，代码里没有任何 if &quot;统计&quot; in text；执行权在代码；回填必须带 tool_call_id。</p>
</blockquote>

<h2 id="05--%E4%BB%A3%E7%A0%81%E8%AE%B2%E8%A7%A3-%E2%91%A1%E5%B7%A5%E5%85%B7--json-schema--%E6%A0%A1%E9%AA%8C%E5%85%B3">05 · 代码讲解 ②：工具 = JSON Schema + 校验关</h2>
<p><strong>Schema 决定模型&quot;能不能填对&quot;，校验决定&quot;填错了会不会炸&quot;——两侧都要设计</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">{ <span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;function&quot;</span>, <span class="hljs-string">&quot;function&quot;</span>: {

  <span class="hljs-string">&quot;description&quot;</span>: <span class="hljs-string">&quot;为当前绑定账号登记一条志愿记录&quot;</span>,
  <span class="hljs-string">&quot;parameters&quot;</span>: {
    <span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;object&quot;</span>,
    <span class="hljs-string">&quot;properties&quot;</span>: {
      <span class="hljs-string">&quot;project_name&quot;</span>: {<span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;string&quot;</span>},
      <span class="hljs-string">&quot;hours&quot;</span>: {<span class="hljs-string">&quot;type&quot;</span>: <span class="hljs-string">&quot;number&quot;</span>},

    },
    <span class="hljs-string">&quot;required&quot;</span>: [<span class="hljs-string">&quot;project_name&quot;</span>, <span class="hljs-string">&quot;hours&quot;</span>]
  }}}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">if</span> d &gt; date.today():  <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;status&quot;</span>: <span class="hljs-string">&quot;error&quot;</span>, ...}   <span class="hljs-comment"># 未来日期</span>
<span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-number">0</span> &lt; h &lt;= <span class="hljs-number">24</span>:   <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;status&quot;</span>: <span class="hljs-string">&quot;error&quot;</span>, ...}   <span class="hljs-comment"># 时长区间</span>
<span class="hljs-keyword">if</span> dup.shape[<span class="hljs-number">0</span>]:      <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;status&quot;</span>: <span class="hljs-string">&quot;error&quot;</span>, ...}   <span class="hljs-comment"># 同人同日重复</span>
</code></pre>
<ul>
<li><strong>必填只留两个</strong>：活动名 + 时长是用户一定会说的；日期、地点可不给</li>
<li><strong>身份不进参数</strong>：姓名学号取自 <code>bound_account</code>，模型无权填写，杜绝张冠李戴</li>
<li><strong>三类硬校验</strong>：日期格式与未来日期、时长 0&lt;h≤24（统一 0.5 刻度）、同人同日重复</li>
<li><strong>错误说人话</strong>：<code>status=error</code> + 具体原因，模型据此解释并请求修正，页面不崩溃</li>
<li><strong>返回结构</strong>：<code>{status, record, personal_total}</code>，模型直接回答&quot;本人累计 16.0 小时&quot;</li>
</ul>
<blockquote>
<p>参数设计的检验标准：模型第一次就能填对；填错时程序能拦住并说清原因。</p>
</blockquote>

<h2 id="06--%E4%BB%A3%E7%A0%81%E8%AE%B2%E8%A7%A3-%E2%91%A2%E6%8D%A2%E8%B4%A6%E5%8F%B7%E5%8D%A1%E7%89%87--%E6%98%8E%E7%BB%86--%E5%AF%B9%E8%AF%9D%E4%B8%80%E8%B5%B7%E6%8D%A2">06 · 代码讲解 ③：换账号，卡片 / 明细 / 对话一起换</h2>
<p><strong><code>switch_account()</code> 是唯一切换入口：先换身份，再清缓存；顶部四张卡始终是&quot;本人数据的实时派生&quot;</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">switch_account</span>(<span class="hljs-params">acc</span>):
    bound_account = <span class="hljs-built_in">dict</span>(acc) <span class="hljs-keyword">if</span> acc <span class="hljs-keyword">else</span> <span class="hljs-literal">None</span>
    show_all_rows = <span class="hljs-literal">False</span>          <span class="hljs-comment"># 回到只看本人</span>
    reset_record_views()           <span class="hljs-comment"># 清空查询 / 统计 / 导出 / 对话</span>

<span class="hljs-keyword">def</span> <span class="hljs-title function_">render_stats</span>():                <span class="hljs-comment"># 四张卡 = 本人数据</span>
    mine = my_records_df()         <span class="hljs-comment"># df[df.姓名 == 绑定账号]</span>
    on  = mine[mine.类型 == <span class="hljs-string">&quot;校内&quot;</span>][<span class="hljs-string">&quot;时长(小时)&quot;</span>].<span class="hljs-built_in">sum</span>()
    off = mine[mine.类型 == <span class="hljs-string">&quot;校外&quot;</span>][<span class="hljs-string">&quot;时长(小时)&quot;</span>].<span class="hljs-built_in">sum</span>()
    n, total = <span class="hljs-built_in">len</span>(mine), on + off  <span class="hljs-comment"># 总时长 = 校内 + 校外</span>
    <span class="hljs-keyword">if</span> clicked():                  <span class="hljs-comment"># 点卡片 → 展开明细</span>
        show_my_records = <span class="hljs-literal">True</span>
        st.rerun()
</code></pre>
<table>
<thead>
<tr>
<th>切换前 · 张三</th>
<th>切换后 · 李四</th>
<th>再录一条 · 张三</th>
</tr>
</thead>
<tbody>
<tr>
<td>4 条 · 总 15.5h（校内 12.5 / 校外 3.0）· 对话 3 轮</td>
<td>2 条 · 总 8.5h（校内 2.5 / 校外 6.0）· 对话已清空</td>
<td>卡片立刻 5 条 · 总 18.5h，明细同步多一行</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>唯一入口</strong>：绑定、切换、退出都走这一个函数，避免多处各写 session_state 导致不同步</li>
<li><strong>缓存一起清</strong>：<code>last_records / last_summary / excel_file / history</code> 全清，防止拿上一账号的结果回答</li>
<li><strong>卡片是派生值</strong>：不额外存统计，直接由 df 过滤求和，所以永远实时、不会与记录打架；总时长 = 校内 + 校外，三个数字永远自洽</li>
<li><strong>总时长要醒目</strong>：总时长卡用深蓝渐变 + 42px 字号 + 占比条单独突出，另外三张是普通白卡</li>
<li><strong>点开即下钻</strong>：点「志愿记录总数」整卡展开逐条明细（日期/项目/类型/时长/地点/备注），可切全部 / 校内 / 校外</li>
</ul>
<blockquote>
<p>Streamlit 每次交互都会重跑整个脚本，<code>st.session_state</code> 是唯一事实来源；多处各写一份就会出现&quot;换了一半&quot;的不一致。</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 口播：状态同步是 Streamlit 最容易出问题的地方——每次交互都重跑整个脚本，session_state 是唯一事实来源。我把绑定、切换、退出全收拢到一个函数，先换身份再清缓存。顶部四张卡是派生值，不额外存统计，永远实时，而且总时长恒等于校内加校外，三个数字不会打架。</p>
</blockquote>

<h2 id="07--%E8%BF%90%E8%A1%8C%E6%9C%BA%E5%88%B6%E4%B8%80%E5%8F%A5%E8%AF%9D%E8%A7%A6%E5%8F%91%E4%B8%89%E6%AC%A1%E5%B7%A5%E5%85%B7%E8%B0%83%E7%94%A8">07 · 运行机制：一句话触发三次工具调用</h2>
<table>
<thead>
<tr>
<th>#</th>
<th>环节</th>
<th>动作</th>
</tr>
</thead>
<tbody>
<tr>
<td>01</td>
<td>用户提交</td>
<td>需求进入 <code>st.chat_input</code></td>
</tr>
<tr>
<td>02</td>
<td>拼装上下文</td>
<td>system（含今天日期、当前账号）+ 历史消息 + tools</td>
</tr>
<tr>
<td>03</td>
<td>模型返回</td>
<td><code>tool_calls</code>，指定查询工具与日期</td>
</tr>
<tr>
<td>04</td>
<td>执行查询</td>
<td>返回 <code>{&quot;status&quot;:&quot;success&quot;,&quot;count&quot;:12}</code></td>
</tr>
<tr>
<td>05</td>
<td>回填结果</td>
<td><code>role=tool</code>，模型发起统计调用</td>
</tr>
<tr>
<td>06</td>
<td>统计工具</td>
<td>分组累加 15.5 / 13.5 / 8.5 / 8.5，并给出校内 / 校外分项</td>
</tr>
<tr>
<td>07</td>
<td>再次回填</td>
<td>模型发起导出调用</td>
</tr>
<tr>
<td>08</td>
<td>写出 xlsx</td>
<td>下载区立即出现按钮</td>
</tr>
<tr>
<td>09</td>
<td>模型生成</td>
<td>中文结论，本轮结束</td>
</tr>
</tbody>
</table>
<p><strong>messages 在三次请求中如何增长</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>system → user → assistant(tool_calls: query) → tool(records)
       → assistant(tool_calls: calc) → tool(summary)
       → assistant(tool_calls: export) → tool(filename) → assistant(最终结论)
</code></pre>
<blockquote>
<p>全流程约 3 次模型请求；限流或超时自动退避重试，失败可一键重发。<br />
活动查询 / 记录登记 / 校内外拆分走单轮分支：一次工具调用即可返回。</p>

<h2 id="08--%E5%B7%A5%E5%85%B7%E8%AE%BE%E8%AE%A1%E5%85%AD%E4%B8%AA%E5%B7%A5%E5%85%B7%E7%9A%84%E5%85%A5%E5%8F%82%E8%BF%94%E5%9B%9E%E4%B8%8E%E5%85%AD%E7%82%B9%E5%8F%96%E8%88%8D">08 · 工具设计：六个工具的入参、返回与六点取舍</h2>
<table>
<thead>
<tr>
<th>工具</th>
<th>入参</th>
<th>返回</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>query_volunteer_data</code></td>
<td><code>start_date</code> 必填 · <code>end_date</code> 必填 · <code>project_name</code> 可选 · <code>scope</code>（me/all）· <code>kind</code>（校内/校外）</td>
<td><code>{status, scope, owner, count, records[], 分类合计}</code></td>
</tr>
<tr>
<td><code>calc_total_hours</code></td>
<td><code>records</code> 可选（省略取最近查询结果）</td>
<td><code>{status, summary[{姓名,总时长,校内,校外,次数}], 总计}</code></td>
</tr>
<tr>
<td><code>calc_hours_by_type</code></td>
<td><code>scope</code> 可选 · <code>start_date</code> / <code>end_date</code> 可选</td>
<td><code>{status, 校内(小时), 校外(小时), 总计(小时), 占比, 项目数}</code></td>
</tr>
<tr>
<td><code>export_volunteer_excel</code></td>
<td><code>summary</code> 可选（省略取最近统计结果）</td>
<td><code>{status, filename, message}</code></td>
</tr>
<tr>
<td><code>query_open_activities</code></td>
<td><code>scope</code> · <code>province</code> · <code>city</code> · <code>district</code> · <code>keyword</code>，全可选（省可反查）</td>
<td><code>{status, school, area, sort_by, on_campus[], off_campus[]}</code></td>
</tr>
<tr>
<td><code>add_volunteer_record</code></td>
<td><code>project_name</code> 必填 · <code>hours</code> 必填 · <code>date</code> / <code>place</code> / <code>kind</code> / <code>note</code> 可选</td>
<td><code>{status, record, personal_total, personal_count}</code></td>
</tr>
</tbody>
</table>
<p><strong>取舍一 · 可选参数</strong>：用户不必说全条件，模型可采用默认行为<br />
<strong>取舍二 · 数据不回传</strong>：省略数组参数，避免长 JSON 被截断导致 400<br />
<strong>取舍三 · 状态三值</strong>：<code>success / empty / error</code> 分别对应结果、提示、修正建议<br />
<strong>取舍四 · 距离不由模型算</strong>：距离排序交给 Haversine 公式，同城才排、跨市改按日期，<code>sort_by</code> 字段告诉模型该怎么说<br />
<strong>取舍五 · 身份不进参数</strong>：姓名学号取自绑定账号，模型无需询问也无权填写，避免张冠李戴<br />
<strong>取舍六 · 分项拆成独立工具</strong>：<code>calc_hours_by_type</code> 一次给出三个口径，不让模型先查再自己相加</p>
<blockquote>
<p><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 口播：六个工具全是我自己设计的。查询起止日期必填、返回带分类合计；统计 records 可以不传、不传就用上次查询结果，就是不让模型把大数组回传。第三个是这次新加的校内外拆分。这六条取舍背后是一个思路：能交给代码的确定性事情，就不要交给模型。</p>
</blockquote>

<table>
<thead>
<tr>
<th>来源</th>
<th>复用内容</th>
</tr>
</thead>
<tbody>
<tr>
<td>demo_1（Streamlit 界面）</td>
<td>页面骨架、<code>st.chat_input</code> 交互、<code>st.session_state</code> 用法</td>
</tr>
<tr>
<td>demo_2（接口与工具调用）</td>
<td><code>OpenAI(api_key, base_url)</code> 写法、<code>tools</code> 协议结构、结果回填循环</td>
</tr>
</tbody>
</table>
<p><strong>本项目新增</strong></p>
<ul>
<li>六个业务工具：入参、返回结构、异常分支均自行设计（含校内外拆分、全国地区活动查询、距离排序与记录录入）</li>
<li>业务数据层：模拟表、条件筛选、按姓名分组、Excel 生成、学校与活动池；独立 <code>geo.py</code> + 两个 json 承载 34 省 / 368 市 / 3078 区县与 1308 所高校</li>
<li>顶部数据卡：四张卡只显示本人数据，总时长卡突出显示，点「志愿记录总数」可下钻逐条明细</li>
<li>稳定性处理：限流退避重试、备用模型、参数格式拦截、非法地区返回可选项</li>
<li>界面与可观测：双栏布局、日志分区、结果表格、省市区三级活动中心、运行日志</li>
<li>测试与交付：AppTest 35 项断言 + 真实模型 3 轮对话验证、依赖清单、环境模板、仓库提交</li>
</ul>
<p><strong>考核要求 → 本项目落点</strong></p>

<thead>
<tr>
<th>考核要求</th>
<th>本项目落点</th>
</tr>
</thead>
<tbody>
<tr>

<td><code>run_agent()</code> 循环 + <code>tool_calls</code> 分派，代码中无关键词分支</td>
</tr>
<tr>
<td>自主新增业务工具</td>
<td>6 个工具（查询 / 统计 / 校内外拆分 / 导出 / 活动 / 录入），入参与返回自设计</td>
</tr>
<tr>
<td>参数设计说明</td>
<td>必填最少 + 三值状态 + 身份不进参数 + 地区可反查</td>
</tr>
<tr>
<td>异常容错与边界</td>
<td>日期格式 / 未来日期 / 时长区间 / 重复记录 / 非法省市区县校验，空结果友好提示</td>
</tr>
<tr>
<td>加分项：日志分区、网页下载、表单、柱状图</td>
<td>全部实现并可视化</td>
</tr>
<tr>
<td>文档与交付</td>

</tr>

<h2 id="13--%E5%90%88%E8%A7%84%E8%AF%B4%E6%98%8E%E6%95%B0%E6%8D%AE%E6%9D%A5%E6%BA%90%E9%9A%90%E7%A7%81%E4%B8%8E%E4%BD%BF%E7%94%A8%E8%BE%B9%E7%95%8C">13 · 合规说明：数据来源、隐私与使用边界</h2>
<p><strong>数据来源</strong>：志愿记录、姓名、学号为课程自建模拟数据；省市区县来自开源数据集 <code>modood/Administrative-divisions-of-China</code>，高校名单与校区地址来自 <code>luhuadong/open-edu-data</code> 与 <code>ZsTs119/china-university-database</code>，均为公开许可数据<br />
<strong>隐私与密钥</strong>：密钥存 <code>.env</code> 并由 gitignore 排除，代码、仓库、幻灯片中均不含真实 Key；所有记录只存于本机内存<br />
<strong>使用边界</strong>：课程演示原型，不作正式认定依据；活动条目为模板生成的演示内容，报名以主办方公告为准<br />
<strong>学术诚信</strong>：工具调用由模型真实发起，未用关键词判断伪造能力；数据由工具真实计算，坐标与距离不由模型生成<br />
<strong>位置信息</strong>：仅用学校公开的校区经纬度估算直线距离，不采集、不存储用户实时定位</p>
<blockquote>
<p>统计结果最终以学校志愿管理系统的原始记录为准。</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 口播：合规这块。志愿记录和姓名学号是模拟数据，不是真实学生信息；省市区县和高校名单来自公开开源数据集，真实但只读。密钥在 .env，代码仓库幻灯片都不含 Key。位置只用公开校区经纬度算直线距离，不采集不存储实时定位。这工具是减重复劳动用的，不作正式认定依据。</p>
</blockquote>

<h2 id="14--%E5%8F%8D%E6%80%9D%E4%B8%8E%E8%AE%A1%E5%88%92">14 · 反思与计划</h2>
<p><strong>当前不足</strong></p>
<ul>
<li>数据存于内存，重启即恢复样例</li>
<li>单用户运行，无登录与多用户隔离</li>
<li>明细面板只读，暂不支持页面内改 / 删</li>
<li>查询条件仍限于日期、项目名、校内外类型，暂不支持时长区间</li>
<li>活动条目为本地生成，非校方实时接口（地区维度真实、内容为演示）</li>
<li>校外距离为直线估算，未接路网导航；跨市不计算距离</li>
<li>区县重名时按行政区划数据首个匹配解析</li>
<li>相对时间依赖模型换算，偶有偏差</li>
<li>多次导出只保留最新一份，无留痕</li>
</ul>
<p><strong>后续计划</strong></p>
<ul>
<li>接入 SQLite，按学期归档数据</li>
<li>登录鉴权 + 提交、审核、归档三步流程</li>
<li>记录支持在线修改、撤销与操作留痕</li>
<li>扩展工具：月度趋势、未达标提醒、按项目分类</li>
<li>对接校团委活动源与地图路线 API，把演示活动池换成实时数据</li>
<li>容器化部署，支持多人同时访问</li>
</ul>
<p><strong>现场演示动线</strong>：① 绑定账号 → ② 一句登记 → ③ 点开明细看校内外 → ④ 统计并导出 → ⑤ 活动中心切到外省再切回本校</p>
<blockquote>
<p>一句话总结：模型负责&quot;听懂 + 编排&quot;，代码负责&quot;计算 + 落盘 + 校验&quot;。</p>
</blockquote>
<blockquote>
<p><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 口播：最后说不足。数据在内存重启恢复样例；单用户没有登录隔离；明细只读；活动条目是模板生成的，不是校方实时接口，但地区维度是真的。下一步优先两件事：接 SQLite 按学期归档，加登录和&quot;提交、审核、归档&quot;流程，然后扩趋势分析，最后对接校团委活动源。一句话总结：模型负责听懂和编排，代码负责计算、落盘和校验——这条边界是我所有取舍的源头。</p>
</blockquote>
<p><strong>谢谢，欢迎提问</strong></p>
